function renderBracketSlide(){if(state.format==='elim'){renderElimTree();return}document.querySelector('#slideTitle').textContent=t('crossFinals');let activeRows=[],historyRows=[],emptyMsg=null;if(state.poolCount===1){const pool=state.pools[0],{ranking}=computeRanking(pool,4,pool.names.length);if(!ranking){emptyMsg=t('poolNotComplete')}else{const nameAt1=i=>i==null?t('notYetKnown'):(pool.names[i]||t('player',i+1));const pairs=[[ranking[0],ranking[3],'semi-0',t('semifinal',1)],[ranking[1],ranking[2],'semi-1',t('semifinal',2)]];const semiRows=pairs.map(([a,b,id,label])=>bracketRow(label,pool.names[a]||t('player',a+1),pool.names[b]||t('player',b+1),pool.results[id],a,b));const sw=[pool.results['semi-0'],pool.results['semi-1']];const doneSemi=sw.every(v=>v!==undefined);const a=sw[0]!==undefined?Number(sw[0]):null,b=sw[1]!==undefined?Number(sw[1]):null;const finalRows=[bracketRow(t('final'),nameAt1(a),nameAt1(b),pool.results.final,a,b)];if(doneSemi){activeRows=finalRows;historyRows=semiRows}else{activeRows=semiRows.concat(finalRows)}}}else{const pc=state.poolCount,quals=[];for(let p=0;p<pc;p++){const{ranking}=computeRanking(state.pools[p],2,state.pools[p].names.length);quals.push(ranking)}const q=p=>quals[p];const anyKnown=quals.some(r=>r);if(!anyKnown){emptyMsg=t('poolsNotComplete')}else if(pc!==2&&pc!==4){;({activeRows,historyRows}=genericBracketRows(pc,quals))}else{const nameAt=(p,i)=>i==null?(p!=null?t('notYetKnownPool',LETTERS[p]):t('notYetKnown')):`${state.pools[p].names[i]||t('player',i+1)} (${LETTERS[p]})`;const pidOrNull=(p,i)=>i==null?null:pid(p,i);let sfSeeds,qfRows=[],doneQF=true;if(pc===4){const qfDefs=[[0,q(0)?q(0)[0]:null,1,q(1)?q(1)[1]:null,t('quarterfinal',1)],[1,q(1)?q(1)[0]:null,0,q(0)?q(0)[1]:null,t('quarterfinal',2)],[2,q(2)?q(2)[0]:null,3,q(3)?q(3)[1]:null,t('quarterfinal',3)],[3,q(3)?q(3)[0]:null,2,q(2)?q(2)[1]:null,t('quarterfinal',4)]];qfRows=qfDefs.map(([aP,aI,bP,bI,label],i)=>bracketRow(label,nameAt(aP,aI),nameAt(bP,bI),state.cross[`qf-${i}`],pidOrNull(aP,aI),pidOrNull(bP,bI)));const w=i=>{const v=state.cross[`qf-${i}`];return v?v.split(':').map(Number):null};const w0=w(0),w1=w(1),w2=w(2),w3=w(3);doneQF=!!(w0&&w1&&w2&&w3);sfSeeds=[[w0?w0[0]:null,w0?w0[1]:null,w2?w2[0]:null,w2?w2[1]:null],[w1?w1[0]:null,w1?w1[1]:null,w3?w3[0]:null,w3?w3[1]:null]]}else{sfSeeds=[[0,q(0)?q(0)[0]:null,1,q(1)?q(1)[1]:null],[1,q(1)?q(1)[0]:null,0,q(0)?q(0)[1]:null]]}const sfAnyKnown=sfSeeds.some(([aP,aI,bP,bI])=>aI!=null||bI!=null);let sfRows=[],finalRows=[],doneSF=false;if(sfAnyKnown){const sfTitles=[t('semifinal',1),t('semifinal',2)];sfRows=sfSeeds.map(([aP,aI,bP,bI],i)=>bracketRow(sfTitles[i],nameAt(aP,aI),nameAt(bP,bI),state.cross[`sf-${i}`],pidOrNull(aP,aI),pidOrNull(bP,bI)));const sf0=state.cross['sf-0'],sf1=state.cross['sf-1'];doneSF=!!(sf0&&sf1);const fA=sf0?sf0.split(':').map(Number):[null,null],fB=sf1?sf1.split(':').map(Number):[null,null];finalRows=[bracketRow(t('final'),nameAt(fA[0],fA[1]),nameAt(fB[0],fB[1]),state.cross.final,pidOrNull(fA[0],fA[1]),pidOrNull(fB[0],fB[1]))]}if(pc===4&&!doneQF){activeRows=qfRows;historyRows=sfRows.concat(finalRows)}else if(!doneSF){activeRows=sfRows.concat(finalRows);historyRows=qfRows}else{activeRows=finalRows;historyRows=[].concat(sfRows,qfRows)}}}document.querySelector('#slideContent').innerHTML=emptyMsg?`<div class="bracket"><div class="done">${esc(emptyMsg)}</div></div>`:`<div class="bracket">${historyRows.join('')}</div><div class="bracket">${activeRows.join('')}</div>`}
function renderDots(){const el=document.querySelector('#dots');if(slides.length<=1){el.innerHTML='';return}el.innerHTML=slides.map((_,i)=>`<span class="dot ${i===slideIndex?'active':''}"></span>`).join('')}
function renderCurrentSlide(){if(!slides.length)return;const slide=slides[slideIndex];if(slide.type==='pool')renderPoolSlide(slide.p);else renderBracketSlide();renderDots()}
function advanceSlide(){if(celebrating)return;if(slides.length<2)return;slideIndex=(slideIndex+1)%slides.length;renderCurrentSlide()}
function setStatus(ok){document.querySelector('#status').textContent=ok?'':t('connectionFailed')}
async function tick(){try{const r=await fetch('/api/state');if(!r.ok)throw Error();const newState=await r.json();const newTally=newState.tally180||{};if(prevTally180){const names=new Set([...Object.keys(prevTally180),...Object.keys(newTally)]);names.forEach(nm=>{const before=prevTally180[nm]||0,after=newTally[nm]||0;for(let i=before;i<after;i++)celebrateQueue.push({type:'180',name:nm})})}prevTally180={...newTally};const newFinishes=newState.finishes||[];if(prevFinishCount!=null&&newFinishes.length>prevFinishCount){newFinishes.slice(prevFinishCount).forEach(f=>celebrateQueue.push({type:'finish',name:f.player,score:f.score}))}prevFinishCount=newFinishes.length;const champ=computeChampion(newState);if(prevChampion!==undefined&&champ&&!prevChampion)celebrateQueue.push({type:'champion',name:champ});prevChampion=champ;state=newState;buildSlides();renderCurrentSlide();setStatus(true);processQueue()}catch(e){setStatus(false)}}
const params=new URLSearchParams(location.search);
const ROTATE_MS=(Number(params.get('interval'))||10)*1000;
const REFRESH_MS=(Number(params.get('refresh'))||5)*1000;
document.documentElement.lang=currentLang();document.querySelector('#slideTitle').textContent=t('loading');renderLangToggle();renderThemeToggle();fetch('/api/version').then(r=>r.json()).then(v=>{const d=new Date(v.date),ds=isNaN(d)?v.date:d.toLocaleDateString(currentLang()==='nl'?'nl-NL':'en-US',{month:'short',day:'numeric',year:'numeric'});document.querySelector('#vertag').textContent=`v${v.version} (${v.commit}, ${ds})`}).catch(()=>{});tick();setInterval(tick,REFRESH_MS);setInterval(advanceSlide,ROTATE_MS);
window.addEventListener('resize',()=>{layoutBracketPan();drawBracketLines()});requestAnimationFrame(bracketPanFrame);
</script></body></html>

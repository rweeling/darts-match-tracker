<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSV Dart competitie · Scorebord</title><link rel="icon" href="/logo.webp"><!-- ds-allow-hardcode: theme-color meta requires a literal hex; matches --bg --><meta name="theme-color" content="#0d0e10"><style>
:root{--bg:#0d0e10;--bg-radial:#1c2126;--line:#2c2d32;--text:#f3f3f5;--muted:#8f9096;--accent:#d7dde3;--done:#6fa8c9;--warn:#e2675f;--card1:#1c1d20;--card2:#131417}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(ellipse at 85% 0%,var(--bg-radial) 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;display:flex;min-height:100vh;overflow:hidden}.wrap{flex:1;display:flex;flex-direction:column;padding:48px 64px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px}.brand{font-size:22px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}.date{font-size:22px;color:var(--muted)}h1{font-size:clamp(40px,5.5vw,68px);margin:0 0 36px;letter-spacing:-.03em}.content{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:start}.standings{display:flex;flex-direction:column;gap:10px}.row{display:grid;grid-template-columns:64px 1fr 100px;align-items:center;gap:18px;padding:14px 20px;border-radius:14px;background:var(--card1);border:1px solid var(--line)}.row.qualify{border-color:var(--done);background:linear-gradient(145deg,var(--card1),var(--card2))}.rank{font-size:clamp(22px,2.6vw,34px);font-weight:800;color:var(--muted)}.row.qualify .rank{color:var(--done)}.name{font-size:clamp(22px,2.6vw,34px);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wins{font-size:clamp(22px,2.6vw,34px);font-weight:800;color:var(--accent);text-align:right}.nextbox{background:var(--card1);border:1px solid var(--line);border-radius:18px;padding:32px}.roundlabel{font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:18px}.matchup{font-size:clamp(26px,3.4vw,44px);font-weight:800;margin:16px 0}.matchup .vs{color:var(--muted);font-weight:600;margin:0 16px;font-size:.6em}.done{font-size:clamp(22px,2.6vw,30px);color:var(--done);font-weight:700}.bracket{display:flex;flex-direction:column;gap:12px}.bmatch{background:var(--card1);border:1px solid var(--line);border-radius:14px;padding:18px 22px}.blabel{font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:8px}.bnames{font-size:clamp(20px,2.4vw,30px);font-weight:700}.bnames .vs{color:var(--muted);font-weight:600;margin:0 12px;font-size:.7em}.bnames .win{color:var(--done)}.bwinner{font-size:16px;color:var(--done);margin-top:6px;font-weight:700}.dots{display:flex;gap:10px;justify-content:center;margin-top:36px}.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}.dot.active{background:var(--accent)}.statusdot{position:fixed;bottom:14px;right:18px;font-size:12px;color:var(--warn)}@media(max-width:900px){.content{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><span class="brand">MSV Dart competitie</span><span class="date" id="dateLabel"></span></div>
<h1 id="slideTitle">Laden…</h1>
<div class="content" id="slideContent"></div>
<div class="dots" id="dots"></div>
</div><div class="statusdot" id="status"></div><script>
const patterns={4:[[2,3,4],[1,4,3],[4,1,2],[3,2,1]],5:[[2,5,4,3],[1,4,5,3],[4,5,1,2],[3,2,1,5],[1,3,2,4]],6:[[2,6,4,5,3],[1,3,6,4,5],[4,2,5,6,1],[3,5,1,2,6],[6,4,3,1,2],[5,1,2,3,4]],7:[[6,4,7,5,2,3],[5,3,7,6,4,1],[4,2,6,5,7,1],[3,1,5,2,6,7],[2,7,4,3,1,6],[1,3,2,7,4,5],[5,2,1,6,3,4]]};
const LETTERS='ABCD';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fixtures(n){const out=[],seen=new Set();if(patterns[n]){patterns[n].forEach((opps,i)=>opps.forEach((p,j)=>{const b=p-1,id=`${Math.min(i,b)}-${Math.max(i,b)}`;if(!seen.has(id)){seen.add(id);out.push({id,a:i,b,col:j})}}));return out}let arr=Array.from({length:n},(_,i)=>i);if(n%2)arr.push(-1);for(let r=0;r<arr.length-1;r++){for(let k=0;k<arr.length/2;k++){let a=arr[k],b=arr[arr.length-1-k];if(a>=0&&b>=0){const id=`${Math.min(a,b)}-${Math.max(a,b)}`;if(!seen.has(id)){seen.add(id);out.push({id,a,b,col:r})}}}arr=[arr[0],arr[arr.length-1],...arr.slice(1,-1)]}return out}
function computeRanking(pool,topN,size){const f=fixtures(size),wins=pool.names.map(()=>0);for(const m of f){const w=pool.results[m.id];if(w!==undefined)wins[Number(w)]++}const complete=f.every(m=>pool.results[m.id]!==undefined);if(!complete)return{wins,ranking:null,pending:true};const order=pool.names.map((_,i)=>i).sort((a,b)=>wins[b]-wins[a]||a-b);const groups=[];let gi=0;while(gi<order.length){let gj=gi+1;while(gj<order.length&&wins[order[gj]]===wins[order[gi]])gj++;groups.push(order.slice(gi,gj));gi=gj}let pos=0,resolved=[],pendingTie=false;for(const group of groups){const lo=pos;if(group.length>1&&lo<=topN-1){const key=group.slice().sort((a,b)=>a-b).join('-');const raw=(pool.bullOrder&&pool.bullOrder[key])||[],picked=raw.filter(x=>x!==''&&x!=null).map(Number);const valid=picked.length===group.length&&group.every(p=>picked.includes(p));if(valid)resolved.push(...picked);else{pendingTie=true;resolved.push(...group)}}else resolved.push(...group);pos+=group.length}return{wins,ranking:pendingTie?null:resolved.slice(0,topN),pending:pendingTie}}
function nextMatches(pool,size){const f=fixtures(size).slice().sort((a,b)=>a.col-b.col);const unplayed=f.filter(m=>pool.results[m.id]===undefined);if(!unplayed.length)return{complete:true,round:null,matches:[]};const round=unplayed[0].col;return{complete:false,round,matches:unplayed.filter(m=>m.col===round)}}
function pid(p,i){return `${p}:${i}`}
function bracketRow(label,aName,bName,winnerVal,aVal,bVal){const decided=winnerVal!==undefined&&winnerVal!==null&&winnerVal!=='';const aWin=decided&&winnerVal===aVal,bWin=decided&&winnerVal===bVal;const winnerName=aWin?aName:(bWin?bName:null);return `<div class="bmatch"><div class="blabel">${esc(label)}</div><div class="bnames"><span class="${aWin?'win':''}">${esc(aName)}</span><span class="vs">vs</span><span class="${bWin?'win':''}">${esc(bName)}</span></div>${decided?`<div class="bwinner">${esc(winnerName)} wint</div>`:''}</div>`}
let state=null,slides=[],slideIndex=0;
function buildSlides(){const list=[];for(let p=0;p<state.poolCount;p++)list.push({type:'pool',p});list.push({type:'bracket'});slides=list;if(slideIndex>=slides.length)slideIndex=0}
function renderPoolSlide(p){const pool=state.pools[p],size=state.size,topN=state.poolCount===1?4:2;const{ranking,pending}=computeRanking(pool,topN,size);const f=fixtures(size),wins=pool.names.map(()=>0);for(const m of f){const w=pool.results[m.id];if(w!==undefined)wins[Number(w)]++}const order=pool.names.map((_,i)=>i).sort((a,b)=>wins[b]-wins[a]||a-b);const qualifySet=new Set(ranking||[]);document.querySelector('#slideTitle').textContent=state.poolCount>1?`Poule ${LETTERS[p]}`:'Tussenstand';const standingsHtml=order.map((i,rank)=>`<div class="row ${qualifySet.has(i)?'qualify':''}"><span class="rank">${rank+1}</span><span class="name">${esc(pool.names[i]||`Speler ${i+1}`)}</span><span class="wins">${wins[i]}</span></div>`).join('');const nm=nextMatches(pool,size);const nextboxHtml=nm.complete?`<div class="roundlabel">Status</div><div class="done">Poule voltooid${pending?' · bull-ronde nodig voor plaatsing':''}</div>`:`<div class="roundlabel">Ronde ${nm.round+1}${nm.matches.length>1?` · ${nm.matches.length} wedstrijden`:''}</div>${nm.matches.map(m=>`<div class="matchup">${esc(pool.names[m.a]||`Speler ${m.a+1}`)}<span class="vs">vs</span>${esc(pool.names[m.b]||`Speler ${m.b+1}`)}</div>`).join('')}`;document.querySelector('#slideContent').innerHTML=`<div class="standings">${standingsHtml}</div><div class="nextbox">${nextboxHtml}</div>`}
function renderBracketSlide(){document.querySelector('#slideTitle').textContent='Kruisfinales';const rows=[];if(state.poolCount===1){const pool=state.pools[0],{ranking}=computeRanking(pool,4,state.size);if(!ranking){rows.push('<div class="done">Poule nog niet compleet</div>')}else{const pairs=[[ranking[0],ranking[3],'semi-0','Halve finale 1'],[ranking[1],ranking[2],'semi-1','Halve finale 2']];pairs.forEach(([a,b,id,label])=>rows.push(bracketRow(label,pool.names[a]||`Speler ${a+1}`,pool.names[b]||`Speler ${b+1}`,pool.results[id],a,b)));const sw=[pool.results['semi-0'],pool.results['semi-1']];if(sw.every(v=>v!==undefined)){const a=Number(sw[0]),b=Number(sw[1]);rows.push(bracketRow('Finale',pool.names[a]||`Speler ${a+1}`,pool.names[b]||`Speler ${b+1}`,pool.results.final,a,b))}}}else{const pc=state.poolCount,quals=[];for(let p=0;p<pc;p++){const{ranking}=computeRanking(state.pools[p],2,state.size);quals.push(ranking)}const q=p=>quals[p];const anyKnown=quals.some(r=>r);if(!anyKnown){rows.push('<div class="done">Poules nog niet allemaal compleet</div>')}else{const nameAt=(p,i)=>i==null?(p!=null?`Nog niet bekend (${LETTERS[p]})`:'Nog niet bekend'):`${state.pools[p].names[i]||`Speler ${i+1}`} (${LETTERS[p]})`;const pidOrNull=(p,i)=>i==null?null:pid(p,i);let sfSeeds;if(pc===4){const qfDefs=[[0,q(0)?q(0)[0]:null,1,q(1)?q(1)[1]:null,'Kwartfinale 1'],[1,q(1)?q(1)[0]:null,0,q(0)?q(0)[1]:null,'Kwartfinale 2'],[2,q(2)?q(2)[0]:null,3,q(3)?q(3)[1]:null,'Kwartfinale 3'],[3,q(3)?q(3)[0]:null,2,q(2)?q(2)[1]:null,'Kwartfinale 4']];qfDefs.forEach(([aP,aI,bP,bI,label],i)=>{const id=`qf-${i}`;rows.push(bracketRow(label,nameAt(aP,aI),nameAt(bP,bI),state.cross[id],pidOrNull(aP,aI),pidOrNull(bP,bI)))});const w=i=>{const v=state.cross[`qf-${i}`];return v?v.split(':').map(Number):null};const w0=w(0),w1=w(1),w2=w(2),w3=w(3);sfSeeds=[[w0?w0[0]:null,w0?w0[1]:null,w2?w2[0]:null,w2?w2[1]:null],[w1?w1[0]:null,w1?w1[1]:null,w3?w3[0]:null,w3?w3[1]:null]]}else{sfSeeds=[[0,q(0)?q(0)[0]:null,1,q(1)?q(1)[1]:null],[1,q(1)?q(1)[0]:null,0,q(0)?q(0)[1]:null]]}const sfAnyKnown=sfSeeds.some(([aP,aI,bP,bI])=>aI!=null||bI!=null);if(sfAnyKnown){const sfTitles=['Halve finale 1','Halve finale 2'];sfSeeds.forEach(([aP,aI,bP,bI],i)=>{const id=`sf-${i}`;rows.push(bracketRow(sfTitles[i],nameAt(aP,aI),nameAt(bP,bI),state.cross[id],pidOrNull(aP,aI),pidOrNull(bP,bI)))});const sf0=state.cross['sf-0'],sf1=state.cross['sf-1'];if(sf0||sf1){const fA=sf0?sf0.split(':').map(Number):[null,null],fB=sf1?sf1.split(':').map(Number):[null,null];rows.push(bracketRow('Finale',nameAt(fA[0],fA[1]),nameAt(fB[0],fB[1]),state.cross.final,pidOrNull(fA[0],fA[1]),pidOrNull(fB[0],fB[1])))}}}}document.querySelector('#slideContent').innerHTML=`<div class="bracket">${rows.join('')}</div>`}
function renderDots(){const el=document.querySelector('#dots');if(slides.length<=1){el.innerHTML='';return}el.innerHTML=slides.map((_,i)=>`<span class="dot ${i===slideIndex?'active':''}"></span>`).join('')}
function renderCurrentSlide(){if(!slides.length)return;const slide=slides[slideIndex];if(slide.type==='pool')renderPoolSlide(slide.p);else renderBracketSlide();renderDots()}
function advanceSlide(){if(slides.length<2)return;slideIndex=(slideIndex+1)%slides.length;renderCurrentSlide()}
function setStatus(ok){document.querySelector('#status').textContent=ok?'':'Verbinding mislukt · laatste bekende stand'}
async function tick(){try{const r=await fetch('/api/state');if(!r.ok)throw Error();state=await r.json();document.querySelector('#dateLabel').textContent=state.date||'';buildSlides();renderCurrentSlide();setStatus(true)}catch(e){setStatus(false)}}
const params=new URLSearchParams(location.search);
const ROTATE_MS=(Number(params.get('interval'))||10)*1000;
const REFRESH_MS=(Number(params.get('refresh'))||5)*1000;
tick();setInterval(tick,REFRESH_MS);setInterval(advanceSlide,ROTATE_MS);
</script></body></html>

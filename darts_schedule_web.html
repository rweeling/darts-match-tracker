function fixtures(){const n=state.size,out=[],seen=new Set();if(patterns[n]){patterns[n].forEach((opps,i)=>opps.forEach((p,j)=>{const b=p-1,id=`${Math.min(i,b)}-${Math.max(i,b)}`;if(!seen.has(id)){seen.add(id);out.push({id,a:i,b,col:j})}}));return _orderRounds(out)}let arr=Array.from({length:n},(_,i)=>i);if(n%2)arr.push(-1);for(let r=0;r<arr.length-1;r++){for(let k=0;k<arr.length/2;k++){let a=arr[k],b=arr[arr.length-1-k];if(a>=0&&b>=0){const id=`${Math.min(a,b)}-${Math.max(a,b)}`;if(!seen.has(id)){seen.add(id);out.push({id,a,b,col:r})}}}arr=[arr[0],arr[arr.length-1],...arr.slice(1,-1)]}return _orderRounds(out)}

let importPending=null;
function renderResetRow(){const row=document.querySelector('#resetRow');if(resetPending){row.innerHTML=`<p class="msg">${t('resetConfirmMsg')}</p><button class="btn danger" id="resetConfirm" type="button">${t('confirmResetBtn')}</button><button class="btn secondary" id="resetCancel" type="button">${t('cancel')}</button>`;document.querySelector('#resetConfirm').onclick=()=>{state.pools=freshPools(state.poolCount,state.size,null);state.cross={};state.date=new Date().toISOString().slice(0,10);resetPending=false;document.querySelector('#dateplayed').value=state.date;saveSoon();renderAll();renderResetRow()};document.querySelector('#resetCancel').onclick=()=>{resetPending=false;renderResetRow()}}else{row.innerHTML=`<button class="btn secondary" id="resetBtn" type="button">${t('resetTournamentBtn')}</button>`;document.querySelector('#resetBtn').onclick=()=>{resetPending=true;renderResetRow()}}}
function renderImportRow(){const row=document.querySelector('#importRow');if(importPending){const label=importPending.date?t('datedLabel',esc(importPending.date)):'';row.innerHTML=`<p class="msg">${t('importConfirmMsg',label)}</p><button class="btn danger" id="importConfirm" type="button">${t('confirmImportBtn')}</button><button class="btn secondary" id="importCancel" type="button">${t('cancel')}</button>`;document.querySelector('#importConfirm').onclick=async()=>{try{state=await api('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(importPending)});document.querySelector('#poolCount').value=state.poolCount;document.querySelector('#size').value=state.size;document.querySelector('#dateplayed').value=state.date||'';document.querySelector('#error').textContent='';importPending=null;buildShell();renderAll();renderImportRow()}catch(e){document.querySelector('#error').textContent=e.message;importPending=null;renderImportRow()}};document.querySelector('#importCancel').onclick=()=>{importPending=null;renderImportRow()}}else{row.innerHTML=`<button class="btn secondary" id="importBtn" type="button" ${authed||!loginRequired?'':'disabled'}>${t('importBackupBtn')}</button><input type="file" id="importFile" accept="application/json" hidden>`;document.querySelector('#importBtn').onclick=()=>document.querySelector('#importFile').click();document.querySelector('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{importPending=JSON.parse(await file.text());document.querySelector('#error').textContent='';renderImportRow()}catch(err){document.querySelector('#error').textContent=t('invalidBackup')}}}}
document.querySelectorAll('#tabNav [data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('#tabNav [data-tab]').forEach(b=>b.classList.toggle('active',b===btn));document.querySelector('#tabMatch').hidden=btn.dataset.tab!=='match';document.querySelector('#tabStats').hidden=btn.dataset.tab!=='stats'});
document.documentElement.lang=currentLang();renderStaticText();renderLangToggle();renderResetRow();renderImportRow();renderThemeToggle();fetch('/api/version').then(r=>r.json()).then(v=>{document.querySelector('#vertag').textContent=`${v.commit} · ${v.date}`}).catch(()=>{});init();
</script></body></html>
